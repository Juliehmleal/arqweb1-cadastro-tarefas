<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Notícia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="imagens/portal.png" alt="Portal de Notícias" height="60">
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="menu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Editar Notícia</h3>
                </div>

                <div class="card-body">
                    <div id="mensagem"></div>

                    <form id="formEditar">
                        <input type="hidden" id="id">

                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" id="titulo" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Autor</label>
                            <input type="text" class="form-control" id="autor" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select id="categoria" class="form-select" required>
                                <option value="">Selecione...</option>
                                <option value="Política">Política</option>
                                <option value="Esporte">Esporte</option>
                                <option value="Cultura">Cultura</option>
                                <option value="Tecnologia">Tecnologia</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Resumo</label>
                            <textarea class="form-control" id="resumo" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Conteúdo</label>
                            <textarea class="form-control" id="conteudo" rows="6" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Imagem da Notícia</label>
                            <select class="form-select" id="imagem">
                                <option value="imagens/padrao.jpg">Padrão</option>
                                <option value="imagens/politica.jpg">Política</option>
                                <option value="imagens/esporte.jpg">Esporte</option>
                                <option value="imagens/cultura.jpg">Cultura</option>
                                <option value="imagens/tecnologia.jpg">Tecnologia</option>
                            </select>
                        </div>

                        <div class="mb-3 text-center">
                            <img id="previewImagem"
                                 src="frontend/imagens/padrao.jpg"
                                 alt="Prévia da imagem"
                                 style="max-width: 100%; height: 250px; object-fit: cover;">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Salvar
                            </button>

                            <button type="button"
                                    class="btn btn-danger"
                                    onclick="excluirNoticia()">
                                Excluir
                            </button>

                            <a href="index.html" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<footer class="mt-5 bg-dark text-white">
    <div class="container py-4">
        <div class="row g-4">

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100">
                    <h5>📧 Contato</h5>
                    <p class="text-white-50 mb-1">Email: julie.hervias@aluno.ifsp.edu.br</p>
                    <p class="text-white-50 mb-0">Email: miguel.prates@aluno.ifsp.edu.br</p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100 text-center">
                    <h5>© Direitos</h5>
                    <p class="text-white-50 mb-0">
                        © 2026 Portal de Notícias<br>
                        Todos os direitos reservados
                    </p>
                </div>
            </div>

        </div>
    </div>
</footer>

<script>
    const API = "http://localhost:8080/arqweb1-01";

    function montarMenu() {
        const logado = sessionStorage.getItem("autenticado") === "true";
        const menu = document.getElementById("menu");

        if (!logado) {
            window.location.href = "login.html";
            return;
        }

        menu.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
            <li class="nav-item"><a class="nav-link" href="cadastrar.html">Cadastrar Notícia</a></li>
            <li class="nav-item"><a class="nav-link" href="listar.html">Notícias</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">Sair</a></li>
        `;
    }

    function pegarIdDaUrl() {
        const parametros = new URLSearchParams(window.location.search);
        return parametros.get("id");
    }

    async function carregarNoticia() {
        const id = pegarIdDaUrl();

        if (!id) {
            document.getElementById("mensagem").innerHTML =
                `<div class="alert alert-danger">ID da notícia não informado.</div>`;
            return;
        }

        const resposta = await fetch(`${API}/detalhes?id=${id}`, {
            credentials: "include"
        });

        const noticia = await resposta.json();

        if (resposta.status !== 200) {
            document.getElementById("mensagem").innerHTML =
                `<div class="alert alert-danger">${noticia.mensagem}</div>`;
            return;
        }

        document.getElementById("id").value = noticia.id;
        document.getElementById("titulo").value = noticia.titulo;
        document.getElementById("autor").value = noticia.autor;
        document.getElementById("categoria").value = noticia.categoria;
        document.getElementById("resumo").value = noticia.resumo;
        document.getElementById("conteudo").value = noticia.conteudo_completo;

        if (noticia.imagem) {
            document.getElementById("imagem").value = noticia.imagem;
            document.getElementById("previewImagem").src = noticia.imagem;
        }
    }

    document.getElementById("imagem").addEventListener("change", function () {
        document.getElementById("previewImagem").src = this.value;
    });

    document.getElementById("formEditar").addEventListener("submit", async function(e) {
        e.preventDefault();

        const dados = new URLSearchParams();

        dados.append("id", document.getElementById("id").value);
        dados.append("titulo", document.getElementById("titulo").value);
        dados.append("autor", document.getElementById("autor").value);
        dados.append("categoria", document.getElementById("categoria").value);
        dados.append("resumo", document.getElementById("resumo").value);
        dados.append("conteudo_completo", document.getElementById("conteudo").value);
        dados.append("imagem", document.getElementById("imagem").value);

        const resposta = await fetch(`${API}/editar`, {
            method: "POST",
            body: dados,
            credentials: "include"
        });

        const resultado = await resposta.json();

        if (resposta.status === 200) {
            document.getElementById("mensagem").innerHTML =
                `<div class="alert alert-success">
                    Notícia atualizada com sucesso! Redirecionando para a Home...
                </div>`;

            setTimeout(() => {
                window.location.href = "index.html";
            }, 2000);
        }

        if (resposta.status === 400) {
            let erros = "";

            if (resultado.problemas) {
                resultado.problemas.forEach(p => erros += `<li>${p}</li>`);
            }

            document.getElementById("mensagem").innerHTML =
                `<div class="alert alert-danger">
                    <strong>${resultado.mensagem}</strong>
                    <ul>${erros}</ul>
                </div>`;
        }

        if (resposta.status === 401) {
            sessionStorage.removeItem("autenticado");
            window.location.href = "login.html";
        }
    });

    async function logout() {
        await fetch(`${API}/logout`, {
            method: "POST",
            credentials: "include"
        });

        sessionStorage.removeItem("autenticado");
        window.location.href = "login.html";
    }

    async function excluirNoticia() {

        const id = document.getElementById("id").value;

        if (!confirm("Deseja realmente excluir esta notícia?")) {
            return;
        }

        const dados = new URLSearchParams();
        dados.append("id", id);

        const resposta = await fetch(`${API}/excluir`, {
            method: "POST",
            body: dados,
            credentials: "include"
        });

        const resultado = await resposta.json();

        if (resposta.status === 200) {

            document.getElementById("mensagem").innerHTML = `
            <div class="alert alert-success">
                Notícia excluída com sucesso!
            </div>
        `;

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        }

        if (resposta.status === 400) {

            document.getElementById("mensagem").innerHTML = `
            <div class="alert alert-danger">
                ${resultado.mensagem}
            </div>
        `;
        }

        if (resposta.status === 401) {

            sessionStorage.removeItem("autenticado");
            window.location.href = "login.html";
        }
    }

    montarMenu();
    carregarNoticia();


</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
