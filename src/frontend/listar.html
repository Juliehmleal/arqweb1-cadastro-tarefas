<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal de Notícias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

        <a class="navbar-brand" href="index.html">
            <img src="imagens/portal.png"
                 alt="Portal de Notícias"
                 height="60">
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="menu"></ul>
        </div>
    </div>
</nav>

<div class="d-flex align-items-center gap-2">
    <input class="form-control" type="search" id="campoBusca"
           placeholder="Buscar notícias...">

    <button class="btn btn-outline-secondary" onclick="buscarNoticias()">
        Buscar
    </button>
</div>

<div class="container mt-4">

    <div id="mensagem"></div>

    <div class="row" id="listaNoticias">

        <div class="text-center">
            <div class="spinner-border"></div>
        </div>

    </div>


</div>

<footer class="mt-5 bg-dark text-white">
    <div class="container py-4">

        <div class="row g-4">

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100">
                    <h5>📧 Contato</h5>

                    <p class="text-white-50 mb-1">
                        julie.hervias@aluno.ifsp.edu.br
                    </p>

                    <p class="text-white-50 mb-0">
                        miguel.prates@aluno.ifsp.edu.br
                    </p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100 text-center">
                    <h5>© Direitos</h5>

                    <p class="text-white-50 mb-0">
                        © 2026 Portal de Notícias
                        <br>
                        Todos os direitos reservados
                    </p>
                </div>
            </div>

        </div>

    </div>
</footer>

<script>

    const API = "http://localhost:8080/arqweb1-01";

    function montarMenu() {

        const logado =
            sessionStorage.getItem("autenticado") === "true";

        const menu =
            document.getElementById("menu");

        if(logado){

            menu.innerHTML = `
            <li class="nav-item">
                <a class="nav-link" href="index.html">
                    Home
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="sobre.html">
                    Sobre
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="cadastrar.html">
                    Cadastrar Notícia
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-danger"
                   href="#"
                   onclick="logout()">
                    Sair
                </a>
            </li>
        `;

        } else {

            menu.innerHTML = `
            <li class="nav-item">
                <a class="nav-link" href="index.html">
                    Home
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="sobre.html">
                    Sobre
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="login.html">
                    Login
                </a>
            </li>
        `;
        }
    }

    async function carregarNoticias() {

        const resposta =
            await fetch(`${API}/listar`, {
                credentials: "include"
            });

        const noticias =
            await resposta.json();

        const lista =
            document.getElementById("listaNoticias");

        lista.innerHTML = "";

        if(noticias.length === 0){

            lista.innerHTML = `
            <div class="text-center mt-5">
                <h3>Não existem notícias cadastradas.</h3>
            </div>
        `;

            return;
        }

        noticias.forEach(noticia => {

            lista.innerHTML += `

        <div class="col-md-4 mb-4">

            <div class="card h-100 shadow">

                <img
                    src="${noticia.imagem}"
                    class="card-img-top"
                    style="height:220px;object-fit:cover;"
                >

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title">
                        ${noticia.titulo}
                    </h5>

                    <h6 class="card-subtitle mb-2 text-muted">
                        ${noticia.categoria}
                    </h6>

                    <p class="card-text">
                        ${noticia.resumo}
                    </p>

                    <div class="mt-auto">

                        <a
                            href="detalhes.html?id=${noticia.id}"
                            class="btn btn-primary btn-sm">
                            Ler
                        </a>

                        <a
                            href="editar.html?id=${noticia.id}"
                            class="btn btn-secondary btn-sm">
                            Editar
                        </a>

                    </div>

                </div>

            </div>

        </div>

        `;
        });
    }

    async function logout(){

        await fetch(`${API}/logout`,{
            method:"POST",
            credentials:"include"
        });

        sessionStorage.removeItem("autenticado");

        window.location.href =
            "login.html";
    }

    montarMenu();
    carregarNoticias();



</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
