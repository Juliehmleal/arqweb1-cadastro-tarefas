<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Notícia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="imagens/portal.png" alt="Portal de Notícias" height="60">
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="menu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">📰 Nova Notícia</h3>
                </div>

                <div class="card-body">
                    <div id="mensagem"></div>

                    <form id="formCadastro">
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" class="form-control" name="titulo" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Autor</label>
                            <input type="text" class="form-control" name="autor" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select class="form-select" name="categoria" required>
                                <option value="">Selecione...</option>
                                <option value="Política">Política</option>
                                <option value="Esporte">Esporte</option>
                                <option value="Cultura">Cultura</option>
                                <option value="Tecnologia">Tecnologia</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Resumo</label>
                            <textarea class="form-control" name="resumo" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Conteúdo</label>
                            <textarea class="form-control" name="conteudo_completo" rows="6" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Imagem da Notícia</label>
                            <select class="form-select" name="imagem" id="imagem">
                                <option value="imagens/padrao.jpg">Padrão</option>
                                <option value="imagens/politica.jpg">Política</option>
                                <option value="imagens/esporte.jpg">Esporte</option>
                                <option value="imagens/cultura.jpg">Cultura</option>
                                <option value="imagens/tecnologia.jpg">Tecnologia</option>
                            </select>
                        </div>

                        <div class="mb-3 text-center">
                            <img id="previewImagem"
                                 src="frontend/imagens/padrao.jpg"
                                 alt="Prévia da imagem"
                                 style="max-width: 100%; height: 250px; object-fit: cover;">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                Salvar
                            </button>

                            <a href="index.html" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<footer class="mt-5 bg-dark text-white">
    <div class="container py-4">
        <div class="row g-4">

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100">
                    <h5>📧 Contato</h5>
                    <p class="text-white-50 mb-1">Email: julie.hervias@aluno.ifsp.edu.br</p>
                    <p class="text-white-50 mb-0">Email: miguel.prates@aluno.ifsp.edu.br</p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100 text-center">
                    <h5>© Direitos</h5>
                    <p class="text-white-50 mb-0">
                        © 2026 Portal de Notícias<br>
                        Todos os direitos reservados
                    </p>
                </div>
            </div>

        </div>
    </div>
</footer>

<script src="assets/cadastrar.js"></script>

</body>
</html>
