<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal de Notícias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                <img src="imagens/portal.png" alt="Portal de Notícias" height="60">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto" id="menu"></ul>

                <div class="d-flex align-items-center gap-2">
                    <input class="form-control" type="search" id="campoBusca"
                           placeholder="Buscar notícias...">

                    <button class="btn btn-outline-secondary" onclick="buscarNoticias()">
                        Buscar
                    </button>

                    <div id="areaLogin"></div>
                </div>

            </div>
        </div>
    </nav>
</div>

<div class="container mt-5">
    <div id="mensagem"></div>
    <div class="row" id="listaNoticias"></div>
</div>

<footer class="mt-5">
    <div class="container py-4">
        <div class="row g-4">

            <div class="col-md-6">
                <div class="footer-box">
                    <div class="footer-title">📧 Contato</div>
                    <p class="footer-text">Email: julie.hervias@aluno.ifsp.edu.br</p>
                    <p class="footer-text">Email: miguel.prates@aluno.ifsp.edu.br</p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="footer-box text-center d-flex flex-column justify-content-center">
                    <div class="footer-title">© Direitos</div>
                    <p class="footer-text mb-0">
                        © 2026 Portal de Notícias<br>
                        Todos os direitos reservados
                    </p>
                </div>
            </div>

        </div>
    </div>
</footer>

<style>
    footer {
        background-color: #000;
        color: #fff;
    }

    .footer-box {
        background-color: #111;
        border-radius: 10px;
        padding: 30px;
        height: 100%;
    }

    .footer-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .footer-text {
        font-size: 15px;
        color: #ccc;
    }

    .card-img-top {
        height: 200px;
        object-fit: cover;
    }
</style>


<script src="assets/index.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
