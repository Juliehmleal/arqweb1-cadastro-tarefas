<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal de Notícias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                <img src="imagens/portal.png" alt="Portal de Notícias" height="60">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto" id="menu"></ul>

                <div class="d-flex align-items-center gap-2">
                    <input class="form-control" type="search" id="campoBusca"
                           placeholder="Buscar notícias...">

                    <button class="btn btn-outline-secondary" onclick="buscarNoticias()">
                        Buscar
                    </button>

                    <div id="areaLogin"></div>
                </div>

            </div>
        </div>
    </nav>
</div>

<div class="container mt-5">
    <div id="mensagem"></div>
    <div class="row" id="listaNoticias"></div>
</div>

<footer class="mt-5">
    <div class="container py-4">
        <div class="row g-4">

            <div class="col-md-6">
                <div class="footer-box">
                    <div class="footer-title">📧 Contato</div>
                    <p class="footer-text">Email: julie.hervias@aluno.ifsp.edu.br</p>
                    <p class="footer-text">Email: miguel.prates@aluno.ifsp.edu.br</p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="footer-box text-center d-flex flex-column justify-content-center">
                    <div class="footer-title">© Direitos</div>
                    <p class="footer-text mb-0">
                        © 2026 Portal de Notícias<br>
                        Todos os direitos reservados
                    </p>
                </div>
            </div>

        </div>
    </div>
</footer>

<style>
    footer {
        background-color: #000;
        color: #fff;
    }

    .footer-box {
        background-color: #111;
        border-radius: 10px;
        padding: 30px;
        height: 100%;
    }

    .footer-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .footer-text {
        font-size: 15px;
        color: #ccc;
    }

    .card-img-top {
        height: 200px;
        object-fit: cover;
    }
</style>

<script>
    const API = "http://localhost:8080/arqweb1-01";

    function montarMenu() {
        const logado = sessionStorage.getItem("autenticado") === "true";

        const menu = document.getElementById("menu");
        const areaLogin = document.getElementById("areaLogin");

        if (logado) {
            menu.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
            <li class="nav-item"><a class="nav-link" href="cadastrar.html">Cadastrar Notícia</a></li>
            <li class="nav-item"><a class="nav-link" href="listar.html">Notícias</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="#" onclick="logout()">Sair</a></li>
        `;

            areaLogin.innerHTML = " ";
        } else {
            menu.innerHTML = `
            <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="sobre.html">Sobre</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="listar.html">Notícias</a>
            </li>
        `;

            areaLogin.innerHTML = `
            <a href="login.html" class="btn btn-outline-primary">Login</a>
        `;
        }
    }

    async function carregarNoticias() {
        const resposta = await fetch(`${API}/listar`, {
            credentials: "include"
        });

        const noticias = await resposta.json();

        renderizarNoticias(noticias);
    }

    function renderizarNoticias(noticias) {
        const lista = document.getElementById("listaNoticias");
        const mensagem = document.getElementById("mensagem");

        lista.innerHTML = "";
        mensagem.innerHTML = "";

        if (noticias.length === 0) {
            mensagem.innerHTML = `
            <div style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
                <div style="text-align:center;">
                    <h2 style="color:#666; font-size:2rem;">Não tem Notícias</h2>
                    <p style="color:#999; margin-top:1rem;">Nenhuma notícia disponível no momento.</p>
                </div>
            </div>
        `;
            return;
        }

        const logado = sessionStorage.getItem("autenticado") === "true";

        noticias.forEach(n => {
            lista.innerHTML += `
            <div class="col-md-4 mb-4 d-flex align-items-stretch">
                <div class="card w-100">
                    <img src="${n.imagem}" class="card-img-top" alt="imagem ${n.categoria}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">${n.titulo}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">${n.categoria}</h6>
                        <p class="card-text">${n.resumo}</p>

                        <a href="detalhes.html?id=${n.id}" class="btn btn-primary m-2">
                            Ler Notícia
                        </a>

                        ${logado ? `
                            <a href="editar.html?id=${n.id}" class="btn btn-secondary m-2">
                                Editar
                            </a>
                        ` : ""}
                    </div>
                </div>
            </div>
        `;
        });
    }

    function buscarNoticias() {
        const termo = document.getElementById("campoBusca").value.toLowerCase();

        fetch(`${API}/listar`, {
            credentials: "include"
        })
            .then(resposta => resposta.json())
            .then(noticias => {
                const filtradas = noticias.filter(n =>
                    n.titulo.toLowerCase().includes(termo) ||
                    n.resumo.toLowerCase().includes(termo) ||
                    n.categoria.toLowerCase().includes(termo)
                );

                renderizarNoticias(filtradas);
            });
    }

    async function logout() {
        const resposta = await fetch(`${API}/logout`, {
            method: "POST",
            credentials: "include"
        });

        if (resposta.status === 200) {
            sessionStorage.removeItem("autenticado");
            window.location.href = "login.html";
        }

        if (resposta.status === 401) {
            sessionStorage.removeItem("autenticado");
            window.location.href = "login.html";
        }
    }

    montarMenu();
    carregarNoticias();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
