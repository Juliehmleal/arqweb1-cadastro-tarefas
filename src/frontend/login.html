<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Portal de Notícias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="imagens/portal.png" alt="Portal de Notícias" height="60">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="menu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-5 d-flex justify-content-center align-items-center">
    <div class="card p-4 shadow" style="width: 600px;">
        <h3 class="text-center mb-4">Login</h3>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label">Login</label>
                <input type="text" name="login" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>
        </form>

        <a href="index.html" class="btn btn-secondary mt-3 w-100">Voltar</a>

        <div id="mensagem" class="mt-3"></div>
    </div>
</div>

<footer class="mt-5 bg-dark text-white">
    <div class="container py-4">
        <div class="row g-4">

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100">
                    <h5>📧 Contato</h5>
                    <p class="text-white-50 mb-1">Email: julie.hervias@aluno.ifsp.edu.br</p>
                    <p class="text-white-50 mb-0">Email: miguel.prates@aluno.ifsp.edu.br</p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100 text-center">
                    <h5>© Direitos</h5>
                    <p class="text-white-50 mb-0">
                        © 2026 Portal de Notícias<br>
                        Todos os direitos reservados
                    </p>
                </div>
            </div>

        </div>
    </div>
</footer>

<script src="assets/login.js"></script>

</body>
</html>
