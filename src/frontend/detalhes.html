<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Notícia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="imagens/portal.png" alt="Portal de Notícias" height="60">
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="menu"></ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div id="mensagem"></div>

    <div class="card shadow" id="cardNoticia" style="display: none;">
        <img id="imagem" class="card-img-top" style="max-height: 420px; object-fit: cover;">

        <div class="card-body">
            <h2 id="titulo" class="card-title"></h2>

            <h6 class="text-muted">
                <span id="categoria"></span> |
                Autor: <span id="autor"></span> |
                Data: <span id="data"></span>
            </h6>

            <hr>

            <p id="resumo" class="lead"></p>

            <p id="conteudo" style="font-size: 18px; line-height: 1.7;"></p>

            <p class="text-muted">
                Visualizações: <span id="visualizacoes"></span>
            </p>

            <div class="d-flex gap-2">
                <a href="index.html" class="btn btn-secondary">Voltar</a>
                <a id="btnEditar" class="btn btn-primary">Editar</a>
            </div>
        </div>
    </div>
</div>

<footer class="mt-5 bg-dark text-white">
    <div class="container py-4">
        <div class="row g-4">

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100">
                    <h5>📧 Contato</h5>
                    <p class="text-white-50 mb-1">Email: julie.hervias@aluno.ifsp.edu.br</p>
                    <p class="text-white-50 mb-0">Email: miguel.prates@aluno.ifsp.edu.br</p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="bg-black rounded p-4 h-100 text-center">
                    <h5>© Direitos</h5>
                    <p class="text-white-50 mb-0">
                        © 2026 Portal de Notícias<br>
                        Todos os direitos reservados
                    </p>
                </div>
            </div>

        </div>
    </div>
</footer>

<script src="assets/detalhes.js"></script>

</body>
</html>
