<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Notícia</title>
</head>
<body>

<h2>Cadastrar Notícia</h2>

<form id="formCadastro">
    <input type="text" name="titulo" placeholder="Título" required><br><br>
    <input type="text" name="autor" placeholder="Autor" required><br><br>
    <input type="text" name="categoria" placeholder="Categoria" required><br><br>
    <textarea name="resumo" placeholder="Resumo" required></textarea><br><br>
    <textarea name="conteudo_completo" placeholder="Conteúdo completo" required></textarea><br><br>
    <input type="text" name="imagem" placeholder="imagens/padrao.jpg"><br><br>

    <button type="submit">Cadastrar</button>
</form>

<pre id="resultado"></pre>

<script>
    document.getElementById("formCadastro")
        .addEventListener("submit", async function(e) {

            e.preventDefault();

            const dados = new URLSearchParams();
            dados.append("titulo", this.titulo.value);
            dados.append("autor", this.autor.value);
            dados.append("categoria", this.categoria.value);
            dados.append("resumo", this.resumo.value);
            dados.append("conteudo_completo", this.conteudo_completo.value);
            dados.append("imagem", this.imagem.value);

            const resposta = await fetch(
                "http://localhost:8080/arqweb1-01/cadastrar",
                {
                    method: "POST",
                    body: dados,
                    credentials: "include"
                }
            );

            const texto = await resposta.text();
            document.getElementById("resultado").textContent = texto;
        });
</script>

</body>
</html>
